[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reporevive"
version = "0.3.0"
description = "Autonomous Software Archaeologist — resurrect abandoned GitHub repositories"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "gitpython>=3.1",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
    "packaging>=23.0",
]
license = {text = "MIT"}
authors = [{name = "Swetha Sri Anumula"}]

[project.scripts]
reporevive = "reporevive.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["reporevive"]
