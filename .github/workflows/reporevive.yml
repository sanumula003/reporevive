name: RepoRevive CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'GitHub URL to revive'
        required: true

jobs:
  revive-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install reporevive
        run: pip install -e .

      - name: Install opencode
        run: curl -fsSL https://opencode.ai/install.sh | bash

      - name: Clone test repos
        run: |
          git clone --depth 1 https://github.com/jmcarp/robobrowser.git /tmp/robobrowser
          git clone --depth 1 https://github.com/jtushman/state_machine.git /tmp/state_machine

      - name: Analyze robobrowser
        run: reporevive analyze /tmp/robobrowser

      - name: Revive robobrowser (dry run)
        run: reporevive revive /tmp/robobrowser --no-repair

      - name: Revive state_machine (dry run)
        run: reporevive revive /tmp/state_machine --no-repair

      - name: Generate artifacts
        run: reporevive generate /tmp/robobrowser
